[package]
name = "clonoforge-core"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yoonecorn/ClonoForge"
description = "Deterministic bounded FASTQ preprocessing and UMI consensus"

[features]
experimental-large = []

[dependencies]
flate2 = "1.1"
sha2 = { version = "0.10", features = ["asm"] }
serde_json = "1.0"

rustix = { version = "1.1.4", features = ["fs"] }
